# CORS_ORIGIN contains the default Render frontend origins. Add exact Netlify/custom frontend origins in the core service environment after deployment.
services:
  - type: web
    name: tredin-user-live
    runtime: static
    plan: free
    rootDir: USER
    buildCommand: echo "TredIN USER ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tredin-admin-live
    runtime: static
    plan: free
    rootDir: ADMIN
    buildCommand: echo "TredIN ADMIN ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tredin-core-live
    runtime: node
    plan: free
    rootDir: BACKEND/core-api
    buildCommand: npm ci --omit=dev
    startCommand: node src/init-db.js && node src/seed-instruments.js && node src/provision-admin.js && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tredin-postgres
          property: connectionString
      # Render private-network host:port; market adapter is a Private Service.
      - key: MARKET_ADAPTER_HOSTPORT
        fromService:
          type: pserv
          name: tredin-market-live
          property: hostport
      - key: CORS_ORIGIN
        value: "https://tredin-user-live.onrender.com,https://tredin-admin-live.onrender.com"
      - key: JWT_ISSUER
        value: tredin
      - key: JWT_SECRET
        generateValue: true
      - key: TREDIN_SYMBOL_MAP
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: pserv
    name: tredin-market-live
    runtime: node
    plan: starter
    rootDir: BACKEND/market-adapter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TREDIN_SYMBOL_MAP
        sync: false
      - key: TRUEDATA_WS_URL
        value: wss://push.truedata.in:8086
      - key: TRUEDATA_REALTIME_PORT
        value: "8086"
      - key: TRUEDATA_USER
        sync: false
      - key: TRUEDATA_PASSWORD
        sync: false

databases:
  - name: tredin-postgres
    plan: free
    databaseName: tredin
    user: tredin
